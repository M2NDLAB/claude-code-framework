# The framework's self-tests on the three platforms it supports. This file is the framework
# repository's own: setup never copies .github/ into a project. Minimal on purpose — it runs
# `make test-scripts`, the upgrade check's self-test, the prerequisite check and the
# generated hooks with the real gitleaks and commitlint, and installs only what they need
# beyond the images: GNU make on Windows, gitleaks on the three, each at a fixed version.
# The real hooks' commit-msg makes npx fetch commitlint from the npm registry: its two
# packages at their pin, their dependencies by the ranges they declare, no hash checked.
name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The token only reads: the tests write nowhere but in their own temporary directories.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    # Named images, never -latest: the platforms the documentation names are the ones
    # verified here, and moving to a new image is a deliberate change. The prerequisite
    # check carries the same list, CI_IMAGES: the documentation check fails when they differ.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # On Windows this is Git Bash, the shell the framework's scripts and hooks run in.
        shell: bash
    steps:
      # Pinned by its full commit SHA: a tag can be moved, a commit cannot. The full history
      # and the tags: the documentation check and the self-tests read the releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Git for Windows ships no make, and the framework declares GNU make a prerequisite.
      - name: GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --no-progress -y
      # gitleaks, which the generated pre-commit hook runs and no image carries: a fixed
      # release, its archive held against a fixed SHA-256 before the binary ever runs — a
      # link of the supply chain, pinned like the checkout action's commit. Any mismatch
      # fails the job.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_DARWIN_ARM64: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
          GITLEAKS_SHA256_WINDOWS_X64: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
        run: |
          case "${RUNNER_OS}" in
            Linux) asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" want="${GITLEAKS_SHA256_LINUX_X64}" ;;
            macOS) asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz" want="${GITLEAKS_SHA256_DARWIN_ARM64}" ;;
            Windows) asset="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip" want="${GITLEAKS_SHA256_WINDOWS_X64}" ;;
            *) echo "::error::no gitleaks archive for ${RUNNER_OS}"; exit 1 ;;
          esac
          dir="${RUNNER_TEMP}/gitleaks"
          if [ "${RUNNER_OS}" = Windows ]; then dir="$(cygpath -u "${RUNNER_TEMP}")/gitleaks"; fi
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          # Hashed from stdin, so the output names no path: GNU's sha256sum escapes a path
          # that holds a backslash. macOS may lack sha256sum; it has shasum.
          got="$( (sha256sum 2>/dev/null || shasum -a 256) < "${dir}/${asset}" | cut -d' ' -f1)"
          if [ "${got}" != "${want}" ]; then
            echo "::error::${asset}: SHA-256 ${got}, expected ${want}"
            exit 1
          fi
          if [ "${RUNNER_OS}" = Windows ]; then
            7z x -y -bso0 -o"$(cygpath -w "${dir}")" "$(cygpath -w "${dir}/${asset}")" gitleaks.exe
            cygpath -w "${dir}" >> "${GITHUB_PATH}"
          else
            tar -xzf "${dir}/${asset}" -C "${dir}" gitleaks
            echo "${dir}" >> "${GITHUB_PATH}"
          fi
      - name: Versions
        run: |
          git --version
          bash --version | head -n 1
          node --version
          npx --version
          make --version | head -n 1
          gitleaks version
          awk --version 2>&1 | head -n 1 || true
          git config --show-origin --get core.autocrlf || echo "core.autocrlf: unset"
      - name: make test-scripts
        run: make test-scripts
      # make stops at the first self-test that fails, which hides the others: after a
      # failure each one runs on its own, so a single run shows every failure. Skipped
      # when everything passes.
      - name: Each self-test on its own (after a failure)
        if: failure()
        run: |
          status=0
          for t in scripts/test-*.sh tools/test-docs-check.sh; do
            echo "::group::${t}"
            bash "${t}" || { status=1; echo "::error::${t} failed"; }
            echo "::endgroup::"
          done
          node tools/docs-check.mjs || status=1
          exit "${status}"
      - name: The upgrade check's self-test
        if: ${{ !cancelled() }}
        run: bash tools/test-upgrade-check.sh
      # The shipped check against the runner's real tools: a tool missing or not starting
      # fails the step. On its own image it must name the image — verified on Linux and macOS,
      # named on Windows —, so its reading of sw_vers and os-release is proven on the images.
      - name: The prerequisite check
        if: ${{ !cancelled() }}
        env:
          IMAGE: ${{ matrix.os }}
        run: |
          out="$(bash scripts/check-prerequisites.sh)" || { printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}"
          case "${RUNNER_OS}" in
            Windows) want="the framework's CI runs" ;;
            *) want="verified by the framework's CI on" ;;
          esac
          line="${out%%$'\n'*} "
          case "${line}" in
            *"not verified"*) ;;
            *"${want} "*"${IMAGE} "*) echo "the platform line names ${IMAGE}: OK"; exit 0 ;;
          esac
          echo "::error::the platform line does not name ${IMAGE} as its image: ${line}"
          exit 1
      - name: The generated hooks with the real tools
        if: ${{ !cancelled() }}
        run: bash tools/test-real-hooks.sh
